name: MEDIA-HUB Branded Timeshift APK

on:
  workflow_dispatch:
  push:
    branches: [pt-hub-timeshift]
    paths:
      - '.github/workflows/media-hub-branding-apk.yml'

permissions:
  contents: write

jobs:
  rebrand-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pt-hub-timeshift
        uses: actions/checkout@v4
        with:
          ref: pt-hub-timeshift
          fetch-depth: 0

      - name: Apply MEDIA-HUB identity and version
        shell: python
        run: |
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.mediahub.tv"', s, count=1)
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 2', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.1.1-alpha"', s, count=1)
          s = s.replace('buildConfigField("boolean", "FEATURE_IN_APP_UPDATES_ENABLED", "true")', 'buildConfigField("boolean", "FEATURE_IN_APP_UPDATES_ENABLED", "false")', 1)
          gradle.write_text(s)

          # The application follows Android's selected device language. We only
          # replace the product name in every locale; translations remain native.
          for strings in Path('app/src/main/res').glob('values*/strings.xml'):
              t = strings.read_text()
              t = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">MEDIA•HUB</string>',
                  t,
                  count=1,
                  flags=re.S,
              )
              strings.write_text(t)

          assert 'applicationId = "com.mediahub.tv"' in s
          assert 'versionCode = 2' in s
          assert 'versionName = "0.1.1-alpha"' in s

      - name: Apply MEDIA-HUB logos, splash assets and launcher artwork
        shell: bash
        run: |
          set -euo pipefail

          MARK='assets/brand/media_hub_logo_mark.png'
          WORDMARK='assets/brand/media_hub_logo_wordmark.png'
          WORDMARK_DARK='assets/brand/media_hub_logo_wordmark_dark.png'

          test -s "$MARK"
          test -s "$WORDMARK"
          test -s "$WORDMARK_DARK"

          # Runtime branding. Nuvio uses these drawable names in splash/onboarding/UI;
          # keeping resource names avoids invasive application-code changes.
          cp "$MARK" app/src/main/res/drawable/app_logo_mark.png
          cp "$MARK" app/src/main/res/drawable/ic_launcher.png
          cp "$WORDMARK_DARK" app/src/main/res/drawable/app_logo_wordmark.png

          # Theme-specific legacy wordmarks must never bring the old Nuvio mark back.
          while IFS= read -r -d '' target; do
            cp "$WORDMARK_DARK" "$target"
          done < <(find app/src/main/res/drawable -maxdepth 1 -type f -name 'app_logo_wordmark_*.png' -print0)

          # Phone / Android TV launcher variants.
          while IFS= read -r -d '' target; do
            cp "$MARK" "$target"
          done < <(find app/src/main/res -type f -path '*/mipmap-*/*' -name 'ic_launcher*.png' -print0)

          # Android TV / Leanback banners.
          while IFS= read -r -d '' target; do
            cp "$WORDMARK_DARK" "$target"
          done < <(find app/src/main/res -type f -path '*/mipmap-*/*' -name 'banner*.png' -print0)

          echo 'MEDIA-HUB runtime, splash, launcher and TV branding applied.'

      - name: Apply MEDIA-HUB brand palette
        shell: python
        run: |
          from pathlib import Path

          theme = Path('app/src/main/java/com/nuvio/tv/ui/theme/ThemeColors.kt')
          t = theme.read_text()

          old = '''    val White = ThemeColorPalette(
              secondary = NuvioPrimitives.neutral100,
              secondaryVariant = NuvioPrimitives.neutral200,
              onSecondary = NuvioPrimitives.neutral925,
              onSecondaryVariant = NuvioPrimitives.neutral925,
              focusRing = NuvioPrimitives.white,
              focusBackground = Color(0xFF303030),
              backgroundCard = NuvioPrimitives.neutral850
          )'''

          new = '''    // MEDIA•HUB default palette — premium dark base with the
          // green, red and gold identity carried by the approved brand artwork.
          val White = ThemeColorPalette(
              secondary = Color(0xFF0B8F55),
              secondaryVariant = Color(0xFF087044),
              onSecondary = Color(0xFFFFFFFF),
              onSecondaryVariant = Color(0xFFFFFFFF),
              accentGradient = listOf(
                  Color(0xFF0B8F55),
                  Color(0xFFD2AA45),
                  Color(0xFFC92A35)
              ),
              focusRing = Color(0xFFD2AA45),
              focusRingGradient = listOf(
                  Color(0xFFD2AA45),
                  Color(0xFF0B8F55)
              ),
              focusBackground = Color(0xFF17362B),
              background = Color(0xFF090B0B),
              backgroundElevated = Color(0xFF111514),
              backgroundCard = Color(0xFF171C1A),
              surface = Color(0xFF121715),
              surfaceVariant = Color(0xFF1D2421),
              panel = Color(0xFF101412),
              field = Color(0xFF171D1A),
              menu = Color(0xFF121715),
              modal = Color(0xFF111514),
              playerOverlay = Color(0xD9000000)
          )'''

          if old in t:
              t = t.replace(old, new, 1)
          elif 'MEDIA•HUB default palette' not in t:
              raise SystemExit('Could not locate default White palette safely.')

          theme.write_text(t)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=MEDIA-HUB Android,O=MEDIA-HUB,C=PT" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Compile and build MEDIA-HUB fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Commit rebrand only after successful build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/res/values*/strings.xml \
            app/src/main/res/drawable/app_logo*.png \
            app/src/main/res/drawable/ic_launcher.png \
            app/src/main/res/mipmap-*/ic_launcher*.png \
            app/src/main/res/mipmap-*/banner*.png \
            app/src/main/java/com/nuvio/tv/ui/theme/ThemeColors.kt
          if git diff --cached --quiet; then
            echo 'MEDIA-HUB 0.1.1 branding already applied.'
          else
            git commit -m 'feat: complete MEDIA-HUB 0.1.1 visual identity'
            git push origin pt-hub-timeshift
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk MEDIA-HUB-0.1.1-alpha-timeshift.apk

      - name: Upload MEDIA-HUB APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-HUB-0.1.1-alpha-timeshift
          path: MEDIA-HUB-0.1.1-alpha-timeshift.apk
          if-no-files-found: error
          retention-days: 7
