name: MEDIA-HUB Branded Timeshift APK

on:
  workflow_dispatch:
  push:
    branches: [pt-hub-timeshift]
    paths:
      - '.github/workflows/media-hub-branding-apk.yml'

permissions:
  contents: read

concurrency:
  group: media-hub-branding-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebrand-build:
    name: Build MEDIA-HUB 0.1.1 alpha APK
    runs-on: ubuntu-latest

    steps:
      - name: Neutralize inherited submodule configuration
        shell: bash
        run: |
          set -euo pipefail
          git config --global submodule.recurse false
          git config --global fetch.recurseSubmodules false
          git config --global checkout.recurseSubmodules false

      - name: Checkout pt-hub-timeshift without submodules
        uses: actions/checkout@v5
        with:
          ref: pt-hub-timeshift
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          clean: false

      - name: Verify committed MEDIA-HUB identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.mediahub.tv"' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "0.1.1-alpha"' app/build.gradle.kts
          grep -q 'MEDIA•HUB' app/src/main/res/values/strings.xml
          grep -q 'MEDIA•HUB default palette' app/src/main/java/com/nuvio/tv/ui/theme/ThemeColors.kt
          test -s assets/brand/media_hub_logo_mark.png
          test -s assets/brand/media_hub_logo_wordmark.png
          test -s assets/brand/media_hub_logo_wordmark_dark.png
          echo 'MEDIA-HUB 0.1.1 identity verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=MEDIA-HUB Android,O=MEDIA-HUB,C=PT" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build MEDIA-HUB fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk MEDIA-HUB-0.1.1-alpha-timeshift.apk

      - name: Upload MEDIA-HUB APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-HUB-0.1.1-alpha-timeshift
          path: MEDIA-HUB-0.1.1-alpha-timeshift.apk
          if-no-files-found: error
          retention-days: 7
