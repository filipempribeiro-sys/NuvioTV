name: MEDIA-HUB Minimal Rebrand APK

on:
  workflow_dispatch:
  push:
    branches: [pt-hub-timeshift]
    paths:
      - '.github/workflows/media-hub-branding-apk.yml'

permissions:
  contents: write

jobs:
  rebrand-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pt-hub-timeshift
        uses: actions/checkout@v4
        with:
          ref: pt-hub-timeshift
          fetch-depth: 0

      - name: Apply minimal MEDIA-HUB technical branding
        shell: python
        run: |
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('applicationId = "com.nuvio.tv"', 'applicationId = "com.mediahub.tv"', 1)
          s = s.replace('versionCode = 1059', 'versionCode = 1', 1)
          s = s.replace('versionName = "0.9.3-beta"', 'versionName = "0.1.0-alpha"', 1)
          # MEDIA-HUB must not offer Nuvio upstream updates.
          s = s.replace('buildConfigField("boolean", "FEATURE_IN_APP_UPDATES_ENABLED", "true")', 'buildConfigField("boolean", "FEATURE_IN_APP_UPDATES_ENABLED", "false")', 1)
          gradle.write_text(s)

          strings = Path('app/src/main/res/values/strings.xml')
          t = strings.read_text()
          t = t.replace('<string name="app_name">Nuvio</string>', '<string name="app_name">MEDIA•HUB</string>', 1)
          strings.write_text(t)

          assert 'applicationId = "com.mediahub.tv"' in s
          assert 'versionCode = 1' in s
          assert 'versionName = "0.1.0-alpha"' in s
          assert '<string name="app_name">MEDIA•HUB</string>' in t

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=MEDIA-HUB Android,O=MEDIA-HUB,C=PT" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Compile and build MEDIA-HUB fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Commit branding only after successful build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/res/values/strings.xml
          if git diff --cached --quiet; then
            echo 'MEDIA-HUB branding already applied.'
          else
            git commit -m 'feat: minimal MEDIA-HUB technical rebrand'
            git push origin pt-hub-timeshift
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk MEDIA-HUB-0.1.0-alpha-timeshift.apk

      - name: Upload MEDIA-HUB APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-HUB-0.1.0-alpha-timeshift
          path: MEDIA-HUB-0.1.0-alpha-timeshift.apk
          if-no-files-found: error
          retention-days: 7
