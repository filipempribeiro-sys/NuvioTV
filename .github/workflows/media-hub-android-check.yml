name: MEDIA-HUB Android Check

on:
  push:
    branches: [media-hub-platform]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/media-hub-android-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/media-hub-android-check.yml'

permissions:
  contents: read

concurrency:
  group: media-hub-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile MEDIA-HUB full debug
        run: ./gradlew :app:compileFullDebugKotlin --stacktrace
      - name: Assemble MEDIA-HUB full debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - name: Upload MEDIA-HUB APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-HUB-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
