name: MEDIA-HUB Android Check

on:
  push:
    branches: [media-hub-platform]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/media-hub-android-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/media-hub-android-check.yml'

permissions:
  contents: read

concurrency:
  group: media-hub-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - name: Download exact source snapshot without Git/submodule traversal
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o "$RUNNER_TEMP/media-hub-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/media-hub-source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/gradlew"
          chmod +x "$GITHUB_WORKSPACE/gradlew"
          echo 'MEDIA-HUB exact commit snapshot extracted without Git/submodule traversal.'

      - name: Use Android debug signing for CI development APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = '''        debug {
              signingConfig = signingConfigs.getByName("release")'''
          new = '''        debug {
              signingConfig = if (useDebugReleaseSigning) {
                  signingConfigs.getByName("debug")
              } else {
                  signingConfigs.getByName("release")
              }'''
          if old not in text:
              raise SystemExit('Expected debug signing block not found; refusing an unsafe CI patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          echo 'MEDIA-HUB CI build configured with the standard Android debug key.'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile MEDIA-HUB full debug
        run: ./gradlew :app:compileFullDebugKotlin --stacktrace

      - name: Assemble MEDIA-HUB full debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload MEDIA-HUB APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-HUB-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
